services:
  analysis_service:
    build: 
      context: ./services/analysis_service
      dockerfile: Dockerfile
    ports:
      - "${ANALYSIS_SERVICE_PORT:-5002}:5002"
    volumes:
      - ./services/analysis_service:/app
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=5002
      - ACCESS_POINT_SERVICE_URL=${ACCESS_POINT_SERVICE_URL}
      - ANALYSIS_HTTP_TIMEOUT=${ANALYSIS_HTTP_TIMEOUT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  access_point_service:
    build: 
      context: ./services/access_point_service
      dockerfile: Dockerfile
    ports:
      - "${ACCESS_POINT_SERVICE_PORT:-5004}:5004"
    volumes:
      - ./services/access_point_service:/app
    environment:
      - FLASK_APP=app.main
      - FLASK_ENV=${FLASK_ENV:-development}
      - PYTHONPATH=${PYTHONPATH:-/app}
      - HOST=${HOST:-0.0.0.0}
      - PORT=5004
      - ACCESS_POINT_DATABASE_URI=${ACCESS_POINT_DATABASE_URI}
      - ACCESS_POINT_HTTP_TIMEOUT=${ACCESS_POINT_HTTP_TIMEOUT}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  frontend_service:
    build: 
      context: ./services/frontend_service
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./services/frontend_service:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=${FLASK_ENV:-development}
      - PYTHONPATH=${PYTHONPATH:-/app}
      - HOST=${HOST:-0.0.0.0}
      - PORT=3000
      - FRONTEND_SECRET_KEY=${FRONTEND_SECRET_KEY}
      - ANALYSIS_SERVICE_URL=${ANALYSIS_SERVICE_URL}
      - ACCESS_POINT_SERVICE_URL=${ACCESS_POINT_SERVICE_URL}
      - FRONTEND_HTTP_TIMEOUT=${FRONTEND_HTTP_TIMEOUT:-120}
      - FRONTEND_HTTP_VERIFY_SSL=${FRONTEND_HTTP_VERIFY_SSL:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      analysis_service:
        condition: service_healthy
      access_point_service:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
